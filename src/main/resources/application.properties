spring.application.name=idq-cli

# --- ETL behaviour --------------------------------------------------------------------------------
# JAVA (default) runs the Java ETL; IDQ invokes the Informatica workflow through the infacmd shell script;
# ORA_SP calls the Oracle stored procedures of idq-to-oracle/ (sp_ors_main_<mapping>) over JDBC;
# SNOWFLAKE_SP calls the Snowflake stored procedures of idq-to-snowflake/ (sp_snow_main_<mapping>).
etl_process=JAVA
# true simulates the infacmd shell script instead of calling Informatica.
mock_infacmd=true
# true reports the stored-procedure calls (etl_process=ORA_SP) instead of executing them.
mock_ora_sp=true
# true reports the stored-procedure calls (etl_process=SNOWFLAKE_SP) instead of executing them.
mock_snowflake_sp=true
# true lets fill-sample-mock-data generate synthetic source rows (Datafaker).
mock_data=true
# Rows generated per source table by fill-sample-mock-data.
idq.mock.rows-per-table=20
# Put in front of every free-text mock value (names, e-mails, address lines, cities), e.g. Test_001 gives
# Test_001-JaneDoe@gmail.com. Codes, keys and reference data are not prefixed. Empty: no prefix.
mock-data-pre-fix=
# Creates the source/lookup objects listed in db/missing-objects.sql when they are absent (CREATE only).
idq.bootstrap-missing-objects=true
# Nothing in this application deletes, truncates or drops: target loads and mock data only insert.

# --- Adhoc-run audit reports (Markdown, one file per target table, in <base-dir>/adhoc_runs_<SOURCE>) -------
idq.report.enabled=true
idq.report.base-dir=.
# Rows shown per table section of a report (at most 1000, the Oracle IN-list limit); the total is always given.
idq.report.max-rows=200

# --- Informatica command line (used only when etl_process=IDQ) ------------------------------------
idq.infacmd.script=docs/batch-script-windows.original.bat
idq.infacmd.domain=Domain_Prod
idq.infacmd.service=DIS_DataQuality
idq.infacmd.application=App_ETL_Master

# --- Oracle stored procedures (used only when etl_process=ORA_SP) -----------------------------------
# Folder with <workflow>/run_<workflow>.sql; its EXEC lines give the procedures and their order.
idq.ora-sp.dir=idq-to-oracle

# --- Snowflake stored procedures (used only when etl_process=SNOWFLAKE_SP) -----------------------------
# Folder with <workflow>/run_<workflow>.sql; its CALL lines give the procedures and their order.
idq.snowflake-sp.dir=idq-to-snowflake
# Connection from the environment only, e.g.
# SNOWFLAKE_JDBC_URL=jdbc:snowflake://<account>.snowflakecomputing.com/?db=<db>&schema=<schema>&warehouse=<wh>&role=<role>
idq.snowflake.url=${SNOWFLAKE_JDBC_URL:}
idq.snowflake.user=${SNOWFLAKE_USER:}
idq.snowflake.password=${SNOWFLAKE_PASSWORD:}

# --- compare-etl-process (ORA_SP vs IDQ on the same source data, no mock data) -----------------------
# Columns left out of the target comparison (they differ on every run).
idq.compare.ignore-columns=ROWID_OBJECT,CREATE_DATE,LAST_UPDATE_DATE,CREATOR,UPDATED_BY,PERIOD_START_DATE,PERIOD_END_DATE

# --- Oracle OCI (wallet based, TNS alias oci4idq_low) ---------------------------------------------
idq.wallet-dir=${IDQ_WALLET_DIR:C:/Users/vamsi/wrk-java/idq-cli/docs/wallet}
spring.datasource.url=jdbc:oracle:thin:@oci4idq_low?TNS_ADMIN=${idq.wallet-dir}
spring.datasource.username=${IDQ_DB_USER:ADMIN}
spring.datasource.password=${IDQ_DB_PASSWORD:OraDBAllG00d_}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=60000

# --- Shell / web ------------------------------------------------------------------------------------
spring.shell.interactive.enabled=true
# Close the application (and the REST endpoint) when the shell exits or a one-shot command completes.
spring.shell.context.close=true
spring.main.banner-mode=off
server.port=8085
logging.level.root=WARN
logging.level.com.idq.cli=INFO
